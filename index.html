<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声で答える</title>
<style>
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #222; }
  .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0 0 10px; }
  .question { font-size: 1rem; line-height: 1.6; font-weight: 600; margin-bottom: 12px; }
  .question:empty { display: none; }
  .transcript { min-height: 140px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; background: #fafbfc; }
  .interim { color: #1f5fbf; }
  button { font-size: 17px; padding: 14px 18px; border: none; border-radius: 10px; background: #1f5fbf; color: #fff; width: 100%; margin-top: 12px; }
  button.rec { background: #c62828; }
  button.secondary { background: #6b7280; }
  button:disabled { background: #9ab; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .msg { font-size: .9rem; color: #b00020; margin-top: 10px; line-height: 1.6; }
  .note { font-size: .8rem; color: #666; margin-top: 10px; line-height: 1.6; }
  .elapsed { font-size: 2.2rem; font-weight: 700; text-align: center; color: #c62828; font-variant-numeric: tabular-nums; margin-top: 12px; }
  .elapsed.done { font-size: 1rem; color: #666; font-weight: 400; }
  .hidden { display: none; }
  /* 録音だけの形（mode=rec）：声の大きさ */
  .meter { height: 12px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin-top: 12px; }
  .meter span { display: block; height: 100%; width: 0; background: #16a34a; transition: width .1s; }
</style>
</head>
<body>
<div class="card">
  <h1>音声で答える</h1>
  <div class="question" id="question"></div>
  <div class="transcript" id="transcriptBox"><span id="final"></span><span class="interim" id="interim"></span></div>
  <p class="note hidden" id="recNote">「🎤 タップして話す」を押して答え、話し終えたら「録音を終える」を押します。録音を AI が文字にして、練習画面の回答の欄に入れます。</p>
  <div class="elapsed hidden" id="elapsed">0:00</div>
  <div class="meter hidden" id="meter" aria-hidden="true"><span id="meterBar"></span></div>
  <button id="micBtn">🎤 タップして話す</button>
  <div id="afterButtons">
    <div class="row" id="afterRow">
      <button class="secondary" id="retryBtn">やり直す</button>
      <button id="doneBtn" disabled>完了して戻る</button>
    </div>
    <button class="secondary" id="cancelBtn">キャンセル</button>
  </div>
  <div class="msg" id="msg"></div>
  <p class="note" id="saveNote">話した内容は、この画面から練習画面に直接送られます。どこにも保存されません。</p>
  <p class="note hidden" id="iosTip">押すたびに「マイクへのアクセス」の確認が出るときは、「設定」→「アプリ」→「Safari」→「マイク」を「許可」にすると、出なくなります（iOS 17 までは「設定」→「Safari」→「マイク」）。</p>
  <p class="note hidden" id="homeTip">ホーム画面のアイコンから開いた推薦ナビで録音がうまくいかないときは、Safari で推薦ナビを開いて試してください。</p>
</div>
<script>
  // 推薦ナビ（旧：面接練習アプリ。Google Apps Script）の音声入力用ページ。
  // Apps Script の画面は埋め込み表示のためマイクが使えない。このページで音声を文字にして、開いた元の画面に送り返す。
  // 質問データや API キーは持たない。文字は postMessage で元の画面にだけ渡し、保存しない。
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const requested = params.get('origin') || '';
  // 送り先は Apps Script の画面（*.googleusercontent.com）だけに限る
  const APP_ORIGIN = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(requested) ? requested : null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  /*
   * iPhone・iPad の Safari の音声認識は、続けて聞くモード（continuous）で、録音中の表示のまま文字もエラーも終わりの知らせも来ずに
   * 固まることがある（2026-11-19 の記録：録音 3〜9 秒・0 字・エラーなし。開発者の報告も多い）。そこで（2026-11-19）
   *  (1) iPhone・iPad では 1 区切りずつ聞いて、終わったら自動でつなぎ直す（話した文字は足していく）
   *  (2) 始めてから STUCK_MS たってもマイクが動き出さない（audiostart が来ない）とき、iPhone・iPad でマイクが動いたあと IDLE_MS 何も来ないときは、
   *      音声認識を作り直して自動でやり直す（MAX_KICKS 回まで。だめなら、もう一度押してもらう）
   *  (3) 何が起きたか（マイクが動いたか・声を拾ったか・やり直した回数・見送ったエラー）を練習画面に知らせる（話した文字は送らない）
   */
  const UA = navigator.userAgent || '';
  const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const CONTINUOUS = !IS_IOS;
  const STUCK_MS = 4000;
  const IDLE_MS = 12000;
  const MAX_KICKS = 2;

  let recognizer = null;
  let listening = false;
  let stopping = false;   // 利用者が止めたか、エラーで止めるべきか（false なら区切りや無音で切れても再開する）
  let finalText = '';
  let restarts = 0;       // 区切りや無音で切れて、自動でつなぎ直した回数
  let diag = { audio: false, speech: false, kicks: 0, skipped: '', asked: false };   // 何が起きたか（記録の手がかり。asked：押したときマイクの確認が出る状態だった）
  let runAudio = false;   // いまの 1 回でマイクが動き出したか
  let lastActivity = 0;
  let watchId = null;
  let autoKicks = 0;      // この録音で、自動で作り直した回数
  let tapAt = 0;
  let deniedOnce = false;
  // マイクの許可の状態（'granted'・'prompt'・'denied'。分からなければ null）。確認が出ているあいだはマイクが動き出さないので、
  // 許可されてから数える（確認で迷っているあいだに作り直すと、確認が何度も出てしまう）
  let micPerm = null;
  let permAt = 0;         // 許可になった時刻
  try {
    navigator.permissions.query({ name: 'microphone' }).then(st => {
      micPerm = st.state;
      st.onchange = () => { micPerm = st.state; if (st.state === 'granted') permAt = Date.now(); };
    }).catch(() => {});
  } catch (e) { /* 分からなくても動く */ }
  const FROM_HOME = params.get('home') === '1';   // ホーム画面に追加したアイコンから開いた練習画面から来た
  /*
   * 録音だけの形（mode=rec。2026-11-20、版 66）：iPhone・iPad の Safari の音声認識は、いったん止まると作り直しても押し直しても戻らなかった
   * （「初めは録音されるが、途中で認識されなくなった。もう一度押しても無反応」）。そこで音声認識は使わず、マイクの録音（MediaRecorder）だけをして、
   * 練習画面に送る。練習画面が学校のサーバーに送り、AI（Gemini）が文字にする（録音は保存しない）。練習画面に AI のキーがないときは、この形では開かない
   */
  const REC = params.get('mode') === 'rec';

  // 前の音声のページを閉じてから、このページで初めてマイクを押すまでの秒数（記録の手がかり）。
  // 2026-11-19 の記録：1 回目は届き、送ってから約 4 秒で開いた 2 回目は「許可」を押しても 0 字。前のページの音声認識が
  // 止まりきらないうちに次を始めるとマイクが動かないのか、を確かめるため
  const LAST_CLOSE_KEY = 'voiceLastClose';
  let prevClose = 0;
  try { prevClose = Number(localStorage.getItem(LAST_CLOSE_KEY)) || 0; } catch (e) { /* 分からなくても動く */ }
  let firstTapAt = 0;
  function markClose() {
    try { localStorage.setItem(LAST_CLOSE_KEY, String(Date.now())); } catch (e) { /* 残せなくても閉じる */ }
  }
  function gapLabel() {
    if (!prevClose || !firstTapAt) return '';
    const s = Math.round((firstTapAt - prevClose) / 1000);
    return s >= 0 && s < 600 ? '・前のページから' + s + '秒' : '';
  }

  function showMsg(t) { $('msg').textContent = t || ''; }

  // うまくいかなかったことを練習画面に知らせる（話した文字は送らない。種類と秒数・字数だけ）。
  // 練習画面に送れないときは、この端末に残して、次に開いたときにまとめて送る
  const PENDING_KEY = 'voicePending';
  function stamp() {
    const d = new Date();
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function readPending() {
    try { const a = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function keepPending(kind, detail) {
    try {
      const a = readPending();
      a.push({ kind: kind, detail: (detail ? detail + '・' : '') + stamp() + ' のこと' });
      localStorage.setItem(PENDING_KEY, JSON.stringify(a.slice(-10)));
    } catch (e) { /* 残せなくても、音声入力は続ける */ }
  }
  function canSend() {
    try { return !!(window.opener && !window.opener.closed && APP_ORIGIN); } catch (e) { return false; }
  }
  function report(kind, detail) {
    if (canSend()) send({ type: 'VOICE_EVENT', kind: kind, detail: detail || '' });
    else keepPending(kind, detail);
  }
  function recSeconds() { return Math.round((totalMs + (listening ? Date.now() - startedAt : 0)) / 1000); }
  // 例「録音9秒・0字・マイク○声×・作り直し2」（○×：マイクが動き出したか・声を拾ったか）
  function recDetail() {
    return '録音' + recSeconds() + '秒・' + finalText.length + '字' + (restarts ? '・つなぎ直し' + restarts + '回' : '') +
      '・マイク' + (diag.audio ? '○' : '×') + '声' + (diag.speech ? '○' : '×') +
      (diag.kicks ? '・作り直し' + diag.kicks : '') + (diag.skipped ? '・' + diag.skipped : '') + (diag.asked ? '・確認あり' : '') + gapLabel() + (FROM_HOME ? '・ホーム画面' : '');
  }

  function render(interim) {
    $('final').textContent = finalText;
    $('interim').textContent = interim || '';
    $('doneBtn').disabled = !finalText;
  }

  // 録音時間の表示（録音中は大きく、止めたら「録音 0:45」と小さく残す）
  let startedAt = 0;
  let tickId = null;
  let totalMs = 0;   // 録音した時間の合計（「続けて話す」の分も足す）。話す速さの計算用に元の画面へ送る

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function updateElapsed() {
    $('elapsed').textContent = formatTime(Date.now() - startedAt);
  }

  // 録音中は「録音を終える」だけを出し、止めたら他のボタンを出す
  function setMic(on) {
    listening = on;
    $('micBtn').textContent = on ? '⏹ 録音を終える' : (finalText ? '🎤 続けて話す' : '🎤 タップして話す');
    $('micBtn').classList.toggle('rec', on);
    $('afterButtons').classList.toggle('hidden', on);
    if (on) {
      startedAt = Date.now();
      $('elapsed').classList.remove('hidden', 'done');
      updateElapsed();
      tickId = setInterval(updateElapsed, 500);
    } else if (tickId) {
      clearInterval(tickId);
      tickId = null;
      totalMs += Date.now() - startedAt;
      $('elapsed').textContent = '録音 ' + formatTime(Date.now() - startedAt);
      $('elapsed').classList.add('done');
    }
  }

  function send(message) {
    if (!canSend()) return false;
    try { window.opener.postMessage(message, APP_ORIGIN); } catch (e) { return false; }
    return true;
  }

  function stopListening() {
    if (listening && recognizer) {
      stopping = true;
      clearWatch();
      recognizer.stop();
    }
  }

  // 固まっていないか見張る（いまの 1 回を始めたときに呼ぶ）
  function clearWatch() {
    if (watchId) { clearInterval(watchId); watchId = null; }
  }
  function armWatch() {
    clearWatch();
    const runStart = Date.now();
    runAudio = false;
    lastActivity = runStart;
    watchId = setInterval(() => {
      if (!listening || stopping) { clearWatch(); return; }
      const now = Date.now();
      // マイクが動き出すまで待つ時間：許可ずみなら STUCK_MS、確認が出る状態なら長め（許可されたら、そこから STUCK_MS）、分からなければ 10 秒
      const wait = micPerm === 'granted' ? STUCK_MS : micPerm === 'prompt' ? 20000 : 10000;
      if (!runAudio && now - Math.max(runStart, permAt) > wait) stuck('マイクが動き出さない', true);
      else if (IS_IOS && runAudio && now - lastActivity > IDLE_MS) stuck('途中で止まった', false);
    }, 500);
  }

  // 固まった音声認識を作り直して、もう一度始める（話した文字は残す）。古いものの知らせは無視する。
  // count=false（黙って考えているだけかもしれない「途中で止まった」）は、あきらめる回数に数えない
  function stuck(reason, count) {
    clearWatch();
    const old = recognizer;
    setup();
    try { old.abort(); } catch (e) { /* 止められなくても、新しいほうで続ける */ }
    if (!count || autoKicks < MAX_KICKS) {
      if (count) autoKicks++;
      diag.kicks++;
      setTimeout(() => {
        if (stopping || !listening) return;
        try { recognizer.start(); armWatch(); } catch (e) { giveUp(reason); }
      }, 300);
      return;
    }
    giveUp(reason);
  }

  function giveUp(reason) {
    stopping = true;
    clearWatch();
    report('error', 'stuck（' + reason + '）・' + recDetail());
    setMic(false);
    render('');
    showMsg('マイクがうまく動きませんでした。もう一度「🎤 タップして話す」を押してください。何度も止まるときは、イヤホン（AirPods など）を外す・ほかのアプリやタブの音を止める・Safari で開き直す、を試してください。');
  }

  function setup() {
    const r = new SR();
    r.lang = 'ja-JP';
    r.continuous = CONTINUOUS;
    r.interimResults = true;
    r.onaudiostart = () => { if (r !== recognizer) return; runAudio = true; diag.audio = true; lastActivity = Date.now(); };
    r.onspeechstart = () => { if (r !== recognizer) return; runAudio = true; diag.speech = true; lastActivity = Date.now(); };
    r.onresult = e => {
      if (r !== recognizer) return;
      runAudio = true;
      lastActivity = Date.now();
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      render(interim);
    };
    r.onerror = e => {
      if (r !== recognizer) return;
      if (e.error === 'no-speech' || e.error === 'aborted') { diag.skipped = e.error; return; }   // 無音や中断では止めずに続ける
      stopping = true;
      clearWatch();
      report('error', e.error + '・' + recDetail());
      if (e.error === 'not-allowed' && Date.now() - tapAt < 3000 && !deniedOnce) {
        // 押してすぐの not-allowed は、マイクの確認とぶつかったことが多い（2026-11-18 の記録：1 回目 1 秒で not-allowed、2 回目は届いた）
        deniedOnce = true;
        showMsg('マイクの確認が出たら「許可」を押してから、もう一度「🎤 タップして話す」を押してください。');
      } else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        showMsg('マイクまたは音声入力が許可されていません。iPhone・iPad は「設定」→「プライバシーとセキュリティ」→「音声認識」で Safari をオンにし、「設定」の Safari で「マイク」を許可し、「設定」→「一般」→「キーボード」で「音声入力」をオンにしてください。');
      } else if (e.error === 'network') {
        showMsg('音声入力のサーバーにつながりませんでした。インターネットにつながっているか確かめて、もう一度お試しください（学校の Wi-Fi でうまくいかないときは、モバイル通信でも試してください）。');
      } else if (e.error === 'audio-capture') {
        showMsg('マイクが使えませんでした。ほかのアプリやタブがマイクを使っていないか、イヤホン（AirPods など）がつながっていないかを確かめて、もう一度お試しください。');
      } else {
        showMsg('音声入力でエラーが出ました（' + e.error + '）。もう一度お試しください。');
      }
    };
    r.onend = () => {
      if (r !== recognizer) return;
      if (!stopping) {
        try { r.start(); restarts++; armWatch(); return; } catch (err) {
          // 再開できないときは止める
          report('restartFailed', (err && err.name || '') + '・' + recDetail());
        }
      }
      clearWatch();
      setMic(false);
      render('');
    };
    recognizer = r;
  }

  // 元の画面から質問文を受け取って表示する（URL には載せない）
  window.addEventListener('message', e => {
    if (e.source !== window.opener || e.origin !== APP_ORIGIN || !e.data) return;
    if (e.data.type === 'VOICE_QUESTION') $('question').textContent = e.data.text || '';
  });

  $('micBtn').addEventListener('click', () => {
    if (!recognizer) return;
    if (listening) { stopListening(); return; }
    try {
      stopping = false;
      autoKicks = 0;
      tapAt = Date.now();
      if (!firstTapAt) firstTapAt = tapAt;
      if (micPerm === 'prompt') diag.asked = true;
      showMsg('');
      recognizer.start();
      setMic(true);
      armWatch();
    } catch (e) {
      // 前の音声認識が終わりきっていないときは、作り直してもう一度
      try {
        setup();
        recognizer.start();
        setMic(true);
        armWatch();
      } catch (e2) {
        showMsg('音声入力を開始できません。');
        report('startFailed', (e2 && e2.name || '') + '・' + recDetail());
      }
    }
  });

  $('retryBtn').addEventListener('click', () => {
    finalText = '';
    totalMs = 0;
    restarts = 0;
    diag = { audio: false, speech: false, kicks: 0, skipped: '', asked: false };
    render('');
    $('elapsed').classList.add('hidden');
    $('micBtn').textContent = '🎤 タップして話す';
  });

  $('doneBtn').addEventListener('click', () => {
    const ms = totalMs + (listening ? Date.now() - startedAt : 0);
    stopListening();
    if (!send({ type: 'VOICE_RESULT', text: finalText, seconds: Math.round(ms / 1000), restarts: restarts })) {
      keepPending('sendFailed', recDetail());
      showMsg('練習画面に送れませんでした。練習画面から開き直してください。');
      return;
    }
    closePage();
    showMsg('送りました。練習画面に戻ってください。');   // 閉じられなかったときの案内
  });

  $('cancelBtn').addEventListener('click', () => {
    const detail = REC ? recDetailRec() : recDetail();
    stopListening();
    report('cancel', detail);
    closePage();
    showMsg('練習画面に戻ってください。');
  });

  // マイクを放す（録音中でなくても。前のページの音声認識が残って、次に開いたページとマイクを取り合わないように）
  function releaseMic() {
    if (REC) { recDiscard = true; recStop(); releaseRecMic(); return; }
    if (!recognizer) return;
    stopping = true;
    clearWatch();
    try { recognizer.abort(); } catch (e) { /* 止まっていれば何もしない */ }
  }

  // 閉じる前にマイクを放し、閉じた時刻を残す。放したあと少し待ってから閉じる
  function closePage() {
    markClose();
    releaseMic();
    setTimeout(() => window.close(), 300);
  }

  // ページを離れるときもマイクを放す（閉じるボタンを使わずに閉じた・別のページに変わった）
  window.addEventListener('pagehide', () => {
    markClose();
    releaseMic();
  });

  /* ===== 録音だけの形（mode=rec） ===== */
  const REC_MAX_SEC = 180;   // 3 分で止める（AI に送る大きさの上限のため）
  let mediaRec = null;
  let recStream = null;
  let recChunks = [];
  let recDiscard = false;    // キャンセル・ページを離れた：送らない
  let recStopTimer = null;
  let meter = null;

  function recMime() {
    const MR = window.MediaRecorder;
    if (!MR || !MR.isTypeSupported) return '';
    return ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].filter(t => MR.isTypeSupported(t))[0] || '';
  }
  function baseMime(m) { return String(m || '').split(';')[0].trim() || 'audio/mp4'; }

  // 例「録音12秒・マイク○声○・wav」（マイク：録音のデータが来たか、声：声の大きさが動いたか。話した中身は送らない）
  function recDetailRec(extra) {
    return '録音' + recSeconds() + '秒・マイク' + (diag.audio ? '○' : '×') + '声' + (diag.speech ? '○' : '×') + (extra ? '・' + extra : '') +
      (diag.asked ? '・確認あり' : '') + gapLabel() + (FROM_HOME ? '・ホーム画面' : '');
  }

  // 声の大きさ（緑の帯）。話しているのに動かなければ、マイクに声が届いていない
  function startMeter(stream, ctx) {
    try {
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser();
      an.fftSize = 1024;
      src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      const id = setInterval(() => {
        an.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        const level = Math.min(1, peak / 64);
        if (level > 0.15) diag.speech = true;
        $('meterBar').style.width = Math.round(level * 100) + '%';
      }, 100);
      meter = { ctx: ctx, id: id };
      $('meter').classList.remove('hidden');
    } catch (e) {
      try { ctx.close(); } catch (e2) { /* 閉じられなくてもよい */ }
    }
  }
  function stopMeter() {
    if (meter) {
      clearInterval(meter.id);
      try { meter.ctx.close(); } catch (e) { /* 閉じられなくてもよい */ }
      meter = null;
    }
    $('meter').classList.add('hidden');
  }
  function releaseRecMic() {
    if (recStream) {
      recStream.getTracks().forEach(t => { try { t.stop(); } catch (e) { /* 止まっていればよい */ } });
      recStream = null;
    }
    stopMeter();
  }

  function recStart() {
    tapAt = Date.now();
    if (!firstTapAt) firstTapAt = tapAt;
    if (micPerm === 'prompt') diag.asked = true;
    showMsg('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      showMsg('このブラウザは録音に対応していません。iPhone・iPad は Safari、PC は Chrome か Edge で開いてください。');
      report('unsupported', '録音（MediaRecorder）なし');
      return;
    }
    // 声の大きさを取る仕組みは、押した操作の中で作る（iPhone はあとから作ると動かない。録音そのものには関係しない）
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    try { if (AC) { ctx = new AC(); if (ctx.resume) ctx.resume(); } } catch (e) { ctx = null; }
    $('micBtn').disabled = true;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      recStream = stream;
      const mime = recMime();
      try { mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); } catch (e) { mediaRec = new MediaRecorder(stream); }
      recChunks = [];
      recDiscard = false;
      mediaRec.ondataavailable = e => { if (e.data && e.data.size) { recChunks.push(e.data); diag.audio = true; } };
      mediaRec.onstop = recFinish;
      mediaRec.start(1000);
      if (ctx) startMeter(stream, ctx);
      $('micBtn').disabled = false;
      setMic(true);
      recStopTimer = setTimeout(() => {
        if (mediaRec && mediaRec.state === 'recording') { showMsg('3 分たったので、録音を止めました。'); recStop(); }
      }, REC_MAX_SEC * 1000);
    }).catch(err => {
      $('micBtn').disabled = false;
      try { if (ctx) ctx.close(); } catch (e) { /* 閉じられなくてもよい */ }
      const name = (err && err.name) || 'Error';
      report('error', name + '・' + recDetailRec());
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        showMsg('マイクが許可されていません。確認が出たら「許可」を押してから、もう一度押してください。出ないときは、iPhone・iPad の「設定」→「アプリ」→「Safari」→「マイク」を「確認」か「許可」にしてください。');
      } else if (name === 'NotFoundError' || name === 'NotReadableError' || name === 'AbortError') {
        showMsg('マイクが使えませんでした。ほかのアプリやタブがマイクを使っていないか、イヤホン（AirPods など）がつながっていないかを確かめて、もう一度押してください。');
      } else {
        showMsg('録音を始められませんでした（' + name + '）。もう一度押してください。');
      }
    });
  }

  function recStop() {
    clearTimeout(recStopTimer);
    if (mediaRec && mediaRec.state !== 'inactive') {
      try { mediaRec.stop(); } catch (e) { /* 止まっていればよい */ }
    }
  }

  // 録音が止まったら：マイクを切り、WAV にして（できなければそのまま）練習画面に送って閉じる
  function recFinish() {
    clearTimeout(recStopTimer);
    const mime = (mediaRec && mediaRec.mimeType) || (recChunks[0] && recChunks[0].type) || 'audio/mp4';
    const blob = new Blob(recChunks, { type: mime });
    recChunks = [];
    releaseRecMic();
    setMic(false);
    if (recDiscard) return;
    const seconds = Math.round(totalMs / 1000);
    if (!blob.size) {
      report('error', '録音が空・' + recDetailRec());
      showMsg('録音できませんでした。もう一度「🎤 タップして話す」を押してください。');
      return;
    }
    $('micBtn').disabled = true;
    $('recNote').textContent = '練習画面に送っています…';
    toWav16k(blob).catch(() => null).then(wav => blobToBase64(wav || blob).then(data => {
      const type = wav ? 'audio/wav' : baseMime(mime);
      if (!send({ type: 'VOICE_AUDIO', data: data, mime: type, seconds: seconds, detail: recDetailRec(wav ? 'wav' : type.replace('audio/', '')) })) {
        keepPending('sendFailed', recDetailRec());
        $('micBtn').disabled = false;
        showMsg('練習画面に送れませんでした。練習画面から開き直してください。');
        return;
      }
      closePage();
      showMsg('送りました。練習画面に戻ってください。');
    }));
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).replace(/^data:[^,]*,/, ''));
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }

  // blob.arrayBuffer がない古い Safari もある
  function blobToArrayBuffer(blob) {
    if (blob.arrayBuffer) return blob.arrayBuffer();
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsArrayBuffer(blob);
    });
  }

  // 16 kHz・1 チャンネルの WAV にする（AI が確実に読める形。iPhone の録音（mp4）は読めないことがある）。作れなければ null
  function toWav16k(blob) {
    const AC = window.AudioContext || window.webkitAudioContext;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC || !OAC) return Promise.resolve(null);
    return blobToArrayBuffer(blob).then(buf => new Promise((resolve, reject) => {
      const ctx = new AC();
      const done = (fn, v) => { try { ctx.close(); } catch (e) { /* 閉じられなくてもよい */ } fn(v); };
      const p = ctx.decodeAudioData(buf, a => done(resolve, a), e => done(reject, e));
      if (p && p.then) p.then(a => done(resolve, a), e => done(reject, e));
    })).then(audio => {
      let rate = 16000;
      let off;
      try { off = new OAC(1, Math.max(1, Math.ceil(audio.duration * rate)), rate); } catch (e) {
        rate = 24000;   // 古い Safari は 16 kHz を作れないことがある
        off = new OAC(1, Math.max(1, Math.ceil(audio.duration * rate)), rate);
      }
      const src = off.createBufferSource();
      src.buffer = audio;
      src.connect(off.destination);
      src.start(0);
      const r = off.startRendering();
      return (r && r.then ? r : new Promise(res => { off.oncomplete = e => res(e.renderedBuffer); }))
        .then(out => new Blob([encodeWav(out.getChannelData(0), rate)], { type: 'audio/wav' }));
    });
  }

  // PCM 16 ビット・1 チャンネルの WAV
  function encodeWav(samples, rate) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF');
    v.setUint32(4, 36 + samples.length * 2, true);
    str(8, 'WAVE');
    str(12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, 1, true);
    v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true);
    v.setUint16(34, 16, true);
    str(36, 'data');
    v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return buf;
  }

  if (REC) {
    $('transcriptBox').classList.add('hidden');
    $('afterRow').classList.add('hidden');
    $('recNote').classList.remove('hidden');
    $('saveNote').textContent = '録音は、AI（Gemini）で文字にするために練習画面へ送ります。アプリには保存しません。';
    $('micBtn').addEventListener('click', () => { if (listening) recStop(); else recStart(); });
  }

  if (IS_IOS) $('iosTip').classList.remove('hidden');
  if (IS_IOS && FROM_HOME) $('homeTip').classList.remove('hidden');
  if (!window.opener || !APP_ORIGIN) {
    showMsg('このページは、推薦ナビ（面接練習）の「音声で答える」ボタンから開いてください。');
    $('micBtn').disabled = true;
    keepPending('noOpener', !window.opener ? '開いた元の画面がない' : '送り先が違う');
  } else if (!REC && !SR) {
    showMsg('このブラウザは音声入力に対応していません。iPhone は Safari、PC は Chrome か Edge で開いてください。');
    $('micBtn').disabled = true;
    report('unsupported', '');
  } else {
    if (!REC) setup();
    // 前に送れなかった記録があれば、一緒に送る（送れたら消す）
    const pending = readPending();
    if (send({ type: 'VOICE_READY', pending: pending }) && pending.length) {
      try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
    }
  }
</script>
</body>
</html>
