<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声で答える</title>
<style>
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #222; }
  .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0 0 10px; }
  .question { font-size: 1rem; line-height: 1.6; font-weight: 600; margin-bottom: 12px; }
  .question:empty { display: none; }
  .transcript { min-height: 140px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; background: #fafbfc; }
  .interim { color: #1f5fbf; }
  button { font-size: 17px; padding: 14px 18px; border: none; border-radius: 10px; background: #1f5fbf; color: #fff; width: 100%; margin-top: 12px; }
  button.rec { background: #c62828; }
  button.secondary { background: #6b7280; }
  button:disabled { background: #9ab; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .msg { font-size: .9rem; color: #b00020; margin-top: 10px; line-height: 1.6; }
  .note { font-size: .8rem; color: #666; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h1>音声で答える</h1>
  <div class="question" id="question"></div>
  <div class="transcript"><span id="final"></span><span class="interim" id="interim"></span></div>
  <button id="micBtn">🎤 タップして話す</button>
  <div class="row">
    <button class="secondary" id="retryBtn">やり直す</button>
    <button id="doneBtn" disabled>完了して戻る</button>
  </div>
  <button class="secondary" id="cancelBtn">キャンセル</button>
  <div class="msg" id="msg"></div>
  <p class="note">話した内容は、この画面から練習画面に直接送られます。どこにも保存されません。</p>
</div>
<script>
  // 面接練習アプリ（Google Apps Script）の音声入力用ページ。
  // Apps Script の画面は埋め込み表示のためマイクが使えない。このページで音声を文字にして、開いた元の画面に送り返す。
  // 質問データや API キーは持たない。文字は postMessage で元の画面にだけ渡し、保存しない。
  const $ = id => document.getElementById(id);
  const requested = new URLSearchParams(location.search).get('origin') || '';
  // 送り先は Apps Script の画面（*.googleusercontent.com）だけに限る
  const APP_ORIGIN = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(requested) ? requested : null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognizer = null;
  let listening = false;
  let stopping = false;   // 利用者が止めたか、エラーで止めるべきか（false なら無音で切れても再開する）
  let finalText = '';

  function showMsg(t) { $('msg').textContent = t || ''; }

  function render(interim) {
    $('final').textContent = finalText;
    $('interim').textContent = interim || '';
    $('doneBtn').disabled = !finalText;
  }

  function setMic(on) {
    listening = on;
    $('micBtn').textContent = on ? '⏹ 話し終わったらタップ' : '🎤 タップして話す';
    $('micBtn').classList.toggle('rec', on);
  }

  function send(message) {
    if (!window.opener || !APP_ORIGIN) return false;
    window.opener.postMessage(message, APP_ORIGIN);
    return true;
  }

  function stopListening() {
    if (listening && recognizer) {
      stopping = true;
      recognizer.stop();
    }
  }

  function setup() {
    recognizer = new SR();
    recognizer.lang = 'ja-JP';
    recognizer.continuous = true;
    recognizer.interimResults = true;
    recognizer.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      render(interim);
    };
    recognizer.onerror = e => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;   // 無音や中断では止めずに続ける
      stopping = true;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        showMsg('マイクまたは音声入力が許可されていません。iPhone は「設定」の Safari で「マイク」を許可し、「設定」→「一般」→「キーボード」で「音声入力」をオンにしてください。');
      } else {
        showMsg('音声入力でエラーが出ました（' + e.error + '）。もう一度お試しください。');
      }
    };
    recognizer.onend = () => {
      if (!stopping) {
        try { recognizer.start(); return; } catch (err) { /* 再開できないときは止める */ }
      }
      setMic(false);
      render('');
    };
  }

  // 元の画面から質問文を受け取って表示する（URL には載せない）
  window.addEventListener('message', e => {
    if (e.source !== window.opener || e.origin !== APP_ORIGIN || !e.data) return;
    if (e.data.type === 'VOICE_QUESTION') $('question').textContent = e.data.text || '';
  });

  $('micBtn').addEventListener('click', () => {
    if (!recognizer) return;
    if (listening) { stopListening(); return; }
    try {
      stopping = false;
      showMsg('');
      recognizer.start();
      setMic(true);
    } catch (e) {
      showMsg('音声入力を開始できません。');
    }
  });

  $('retryBtn').addEventListener('click', () => {
    finalText = '';
    render('');
  });

  $('doneBtn').addEventListener('click', () => {
    stopListening();
    if (!send({ type: 'VOICE_RESULT', text: finalText })) {
      showMsg('練習画面に送れませんでした。練習画面から開き直してください。');
      return;
    }
    window.close();
    showMsg('送りました。練習画面に戻ってください。');   // 閉じられなかったときの案内
  });

  $('cancelBtn').addEventListener('click', () => {
    stopListening();
    window.close();
    showMsg('練習画面に戻ってください。');
  });

  if (!window.opener || !APP_ORIGIN) {
    showMsg('このページは、面接練習アプリの「音声で答える」ボタンから開いてください。');
    $('micBtn').disabled = true;
  } else if (!SR) {
    showMsg('このブラウザは音声入力に対応していません。iPhone は Safari、PC は Chrome か Edge で開いてください。');
    $('micBtn').disabled = true;
  } else {
    setup();
    send({ type: 'VOICE_READY' });
  }
</script>
</body>
</html>
